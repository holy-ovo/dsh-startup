<style id="dsh-splash-style">
/* ══ dsh-startup ══════════════════════════════════════════════════
   一条规则决定生死：即使这段 HTML 之外的一切（脚本、视频、网络）都失败，
   #dsh-splash 的 dsh-sp-hide 动画也会在 7.2 秒后把它收掉。
   所以这里不含任何 JS 依赖。

   尺度原则：所有字号用 clamp(下限, vw, 上限)。1280 宽取偏小值，
   2560 宽取上限 —— 上一版把上限卡在 64px，于是大屏上标题只有画布 1/4 宽，
   整个画面看着"空"。 */

#dsh-splash {
  position: fixed; inset: 0; z-index: 2147483000;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 72% 32%, rgba(22, 60, 104, .55) 0%, rgba(3, 8, 16, .98) 68%),
    linear-gradient(160deg, #061423 0%, #02060d 100%);
  animation: dsh-sp-hide 9.4s ease forwards;
  overflow: hidden;
  contain: layout paint;
  --edge-top: 7.4%;
  --edge-bottom: 92.6%;
  --col-a: 3.2vw;
  --col-b: 52vw;
}
@keyframes dsh-sp-hide {
  0%, 90% { opacity: 1; visibility: visible; }
  100%    { opacity: 0; visibility: hidden; }
}
/* 时间锚点：一旦打上这个类，之后任何重复注入的副本都会在到达时直接不可见 */
html.dsh-splash-done #dsh-splash { display: none !important; }

#dsh-splash .sp-letterbox i {
  position: absolute; left: 0; right: 0; height: 7.4%;
  background: #000; z-index: 6;
}
#dsh-splash .sp-letterbox i:first-child { top: 0; }
#dsh-splash .sp-letterbox i:last-child { bottom: 0; }

/* ── B · 海底：等深线 + 海雪 ─────────────────────────────────────────── */
/* 下半屏的等深线：5–7 条极淡水平线，只在下半部显现（mask 把上半截隐掉） */
#dsh-splash .sp-bathy {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: repeating-linear-gradient(180deg,
    rgba(150, 205, 235, .055) 0 1px, transparent 1px 26px);
  -webkit-mask-image: linear-gradient(to bottom, transparent 26%, #000 72%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 26%, #000 72%, #000 100%);
}
/* 海雪：向下飘，和气泡反向 —— 让"水在动"不只是一个方向 */
#dsh-splash .sp-snow { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#dsh-splash .sp-snow i {
  position: absolute; top: -8%; border-radius: 50%;
  background: rgba(226, 240, 255, .7);
  animation: spSnow linear infinite;
  opacity: 0;
}
@keyframes spSnow {
  0%   { transform: translate(0, 0); opacity: 0; }
  10%  { opacity: .55; }
  80%  { opacity: .3; }
  100% { transform: translate(-2.2vw, 118vh); opacity: 0; }
}

/* ── A · 声呐显示盘：同心圆 + 慢转扫描线 + 三个回波点 ────────────────── */
#dsh-splash .sp-sonar {
  position: absolute; left: 4vw; top: 24vh;
  width: 56vmin; height: 56vmin; z-index: 0;
  border-radius: 50%;
  opacity: .42;
  pointer-events: none;
}
#dsh-splash .sp-sonar .sp-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(150, 205, 235, .10);
}
#dsh-splash .sp-sonar .sp-ring:nth-child(2) { inset: 16%; border-color: rgba(150, 205, 235, .085); }
#dsh-splash .sp-sonar .sp-ring:nth-child(3) { inset: 32%; border-color: rgba(150, 205, 235, .07); }
#dsh-splash .sp-sonar .sp-ring:nth-child(4) {
  inset: 48%; border-color: rgba(200, 169, 106, .10);
}
/* 十字准线 */
#dsh-splash .sp-sonar .sp-cross::before,
#dsh-splash .sp-sonar .sp-cross::after {
  content: ''; position: absolute; background: rgba(150, 205, 235, .07);
}
#dsh-splash .sp-sonar .sp-cross::before { left: 50%; top: 0; bottom: 0; width: 1px; }
#dsh-splash .sp-sonar .sp-cross::after { top: 50%; left: 0; right: 0; height: 1px; }
/* 扫描线：只在上半球那段锥形亮，其余透明 */
#dsh-splash .sp-sonar .sp-sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg,
    rgba(150, 215, 255, .22) 0deg,
    rgba(150, 215, 255, .06) 26deg,
    transparent 60deg,
    transparent 360deg);
  animation: spSweep 14s linear infinite;
  mix-blend-mode: screen;
}
@keyframes spSweep { to { transform: rotate(360deg); } }
#dsh-splash .sp-sonar .sp-blip {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: rgba(190, 235, 255, .95);
  box-shadow: 0 0 10px rgba(150, 215, 255, .85);
  opacity: 0;
  animation: spBlip 3.6s ease-in-out infinite;
}
@keyframes spBlip {
  0%, 100% { opacity: 0; transform: scale(.6); }
  14%      { opacity: 1; transform: scale(1); }
  46%      { opacity: .18; transform: scale(.9); }
}

/* ── C · 三栏：两条 1px 竖线把画面切成 仪器 / 文字 / 人物 ───────────── */
#dsh-splash .sp-vline {
  position: absolute; top: var(--edge-top); bottom: calc(100% - var(--edge-bottom));
  width: 1px; z-index: 0; opacity: .35;
  background: linear-gradient(180deg,
    rgba(200, 169, 106, .04), rgba(200, 169, 106, .20) 18%,
    rgba(200, 169, 106, .12) 82%, rgba(200, 169, 106, .03));
}
#dsh-splash .sp-vline-a { left: var(--col-a); }
#dsh-splash .sp-vline-b { left: var(--col-b); }

/* 极淡的移动光斑 */
#dsh-splash .sp-glow-a,
#dsh-splash .sp-glow-b {
  position: absolute; border-radius: 50%; z-index: 0; pointer-events: none;
}
#dsh-splash .sp-glow-a {
  width: 70vw; height: 70vw; left: -20vw; top: -18vw;
  background: radial-gradient(circle, rgba(96, 150, 210, .18), transparent 62%);
  animation: spGlowA 11s ease-in-out infinite alternate;
}
#dsh-splash .sp-glow-b {
  width: 60vw; height: 60vw; right: -14vw; bottom: -20vw;
  background: radial-gradient(circle, rgba(200, 169, 106, .12), transparent 62%);
  animation: spGlowB 13s ease-in-out infinite alternate;
}
@keyframes spGlowA { from { transform: translate(0, 0) scale(1); } to { transform: translate(4%, 3%) scale(1.1); } }
@keyframes spGlowB { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(-4%, -3%) scale(1); } }

/* 角色视频：右下，translateZ(0) 钉住合成层 */
#dsh-splash .sp-video {
  position: absolute; right: 0; bottom: 0; height: 96%; width: auto;
  opacity: 0; transition: opacity 1200ms cubic-bezier(.16, 1, .3, 1);
  transform: translateZ(0);
  filter: saturate(.86) contrast(1.06) brightness(.97);
  z-index: 2;
}
#dsh-splash.has-video .sp-intro { opacity: 1; }
/* 常驻循环段：接在出场段第 2.55 秒（同一帧），淡入后一直动 */
#dsh-splash .sp-idle { opacity: 0; transition: opacity 420ms linear; }
#dsh-splash.has-idle .sp-idle { opacity: 1; }
#dsh-splash.has-idle .sp-intro { opacity: 0; transition: opacity 420ms linear; }

/* ── 光的三拍子（L1 电影感打底）─────────────────────────────────────
   参考「大肥鱼开机动画」：逆光剪影 + 光带扫过 → 脑后爆发 → 正面光稳住。
   全部在视频层之下（z-index:1），透过抠像的透明区域透出来，像是打在她背后。 */
#dsh-splash .sp-beam {
  position: absolute; z-index: 1; pointer-events: none;
  left: 50%; top: 50%; width: 170vh; height: 2.6vh;
  margin: -1.3vh 0 0 -85vh;
  background: linear-gradient(90deg,
    transparent 0%, rgba(150, 200, 240, 0) 6%,
    rgba(198, 228, 255, .55) 38%, rgba(246, 252, 255, .95) 50%,
    rgba(186, 220, 250, .5) 62%, transparent 94%);
  filter: blur(7px);
  opacity: 0;
  transform: rotate(-23deg) translateX(-52vw) scaleY(.55);
  animation: spBeam 2.4s cubic-bezier(.33, 0, .18, 1) .5s forwards;
  will-change: transform, opacity;
}
@keyframes spBeam {
  0%   { opacity: 0;  transform: rotate(-23deg) translateX(-52vw) scaleY(.55); }
  14%  { opacity: .0; transform: rotate(-23deg) translateX(-38vw) scaleY(.7); }
  26%  { opacity: .9; transform: rotate(-23deg) translateX(-14vw) scaleY(1); }
  62%  { opacity: .75; transform: rotate(-23deg) translateX(18vw) scaleY(1); }
  100% { opacity: 0;  transform: rotate(-23deg) translateX(56vw) scaleY(.7); }
}

/* 第二道：与第一道交叉成 X，延迟 0.42s，亮度略低，反向扫过 */
#dsh-splash .sp-beam-2 {
  position: absolute; z-index: 1; pointer-events: none;
  left: 50%; top: 50%; width: 170vh; height: 2.2vh;
  margin: -1.1vh 0 0 -85vh;
  background: linear-gradient(90deg,
    transparent 0%, rgba(150, 200, 240, 0) 6%,
    rgba(180, 216, 248, .42) 38%, rgba(236, 247, 255, .8) 50%,
    rgba(170, 210, 246, .4) 62%, transparent 94%);
  filter: blur(9px);
  opacity: 0;
  transform: rotate(19deg) translateX(48vw) scaleY(.55);
  animation: spBeam2 2.6s cubic-bezier(.33, 0, .18, 1) .92s forwards;
  will-change: transform, opacity;
}
@keyframes spBeam2 {
  0%   { opacity: 0;   transform: rotate(19deg) translateX(48vw) scaleY(.55); }
  16%  { opacity: 0;   transform: rotate(19deg) translateX(34vw) scaleY(.7); }
  30%  { opacity: .72; transform: rotate(19deg) translateX(10vw) scaleY(1); }
  64%  { opacity: .55; transform: rotate(19deg) translateX(-16vw) scaleY(1); }
  100% { opacity: 0;   transform: rotate(19deg) translateX(-52vw) scaleY(.7); }
}

#dsh-splash .sp-burst {
  position: absolute; z-index: 1; pointer-events: none;
  right: 9vw; top: 17vh; width: 62vh; height: 62vh; border-radius: 50%;
  background: radial-gradient(circle at 50% 46%,
    rgba(246, 252, 255, .68) 0%,
    rgba(188, 224, 252, .44) 15%,
    rgba(126, 182, 238, .22) 34%,
    rgba(74, 132, 200, .07) 52%,
    rgba(40, 90, 160, 0) 68%);
  filter: blur(18px);
  opacity: 0; transform: scale(.52);
  animation: spBurst 2.1s cubic-bezier(.16, 1, .3, 1) 2.3s forwards;
  will-change: transform, opacity;
}
@keyframes spBurst {
  0%   { opacity: 0;   transform: scale(.52); }
  18%  { opacity: .82; transform: scale(.94); }
  34%  { opacity: .52; transform: scale(1.03); }
  100% { opacity: 0;   transform: scale(1.16); }
}

/* ── 文字栏 ─────────────────────────────────────────────────────────── */
#dsh-splash .sp-col {
  position: absolute; left: 6.4vw; top: 25vh;
  width: 43vw; max-width: 1180px;
  z-index: 4; transform: translateZ(0);
}
#dsh-splash .sp-index {
  display: flex; align-items: center; gap: 12px;
  font: 500 clamp(10px, 0.62vw, 14px)/1 ui-monospace, Consolas, monospace;
  letter-spacing: .42em; color: rgba(200, 169, 106, .72);
  opacity: 0; animation: spIdx 900ms cubic-bezier(.16, 1, .3, 1) 1.5s both;
}
#dsh-splash .sp-index em { width: 34px; height: 1px; background: rgba(200, 169, 106, .55); }
@keyframes spIdx { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

#dsh-splash .sp-title {
  margin: 30px 0 0;
  font-family: "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  font-size: clamp(44px, 4.55vw, 108px);
  font-weight: 600; line-height: 1.22;
  letter-spacing: .34em; color: #f4eee3;
  white-space: nowrap;
  text-shadow: 0 4px 60px rgba(0, 0, 0, .65), 0 0 90px rgba(200, 169, 106, .12);
  opacity: 0; filter: blur(14px);
  animation: spTitle 1200ms cubic-bezier(.16, 1, .3, 1) 1.0s forwards;
}
@keyframes spTitle {
  from { opacity: 0; filter: blur(14px); letter-spacing: .34em; }
  to   { opacity: 1; filter: blur(0);    letter-spacing: .08em; }
}
#dsh-splash .sp-rule {
  margin: 34px 0 0; width: 190px; height: 1px;
  background: linear-gradient(90deg, rgba(200, 169, 106, .95), rgba(200, 169, 106, 0));
  transform-origin: 0 50%; transform: scaleX(0);
  animation: spRule 900ms cubic-bezier(.16, 1, .3, 1) 2.4s forwards;
}
@keyframes spRule { to { transform: scaleX(1); } }
#dsh-splash .sp-sub {
  margin-top: 20px;
  font: 400 clamp(10px, 0.6vw, 14px)/1 ui-monospace, Consolas, monospace;
  letter-spacing: .52em; color: rgba(200, 169, 106, .8);
  opacity: 0; animation: spIdx 900ms ease 2.6s both;
}

/* 三行读数：clip-path 揭开 + 打字机顿挫；字号随视口长到 18px */
#dsh-splash .sp-steps {
  margin-top: 30px;
  padding-left: 16px;
  border-left: 1px solid rgba(150, 205, 235, .16);
  display: flex; flex-direction: column; gap: 4px;
}
#dsh-splash .sp-step {
  font: 400 clamp(13px, 0.78vw, 18px)/1.8 ui-monospace, Consolas, monospace;
  letter-spacing: .13em; color: rgba(160, 216, 247, .82);
  white-space: nowrap;
  opacity: 0;
  clip-path: inset(0 100% 0 0);
  animation: spStep 600ms steps(22, end) forwards;
}
#dsh-splash .sp-step:nth-child(1) { animation-delay: 1.6s; }
#dsh-splash .sp-step:nth-child(2) { animation-delay: 2.6s; }
#dsh-splash .sp-step:nth-child(3) { animation-delay: 3.6s; }
@keyframes spStep { to { opacity: 1; clip-path: inset(0 0 0 0); } }
#dsh-splash .sp-step:last-child::after {
  content: ''; display: inline-block; vertical-align: -2px;
  width: .38em; height: 1.05em; margin-left: 8px;
  background: rgba(160, 216, 247, .85);
  animation: spCaret 1s steps(2, end) infinite;
}
@keyframes spCaret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

/* ── 深度尺：现在贯穿整幅（9% → 91%），探测器走完全程 ───────────────── */
#dsh-splash .sp-depth {
  position: absolute; left: 6.4vw; top: 8.6vh; z-index: 4;
  font: 500 clamp(12px, 0.7vw, 16px)/1 ui-monospace, Consolas, monospace;
  letter-spacing: .2em; color: rgba(255, 244, 226, .8);
}
#dsh-splash .sp-depth small {
  display: block; margin-top: 8px; font-size: clamp(8.5px, 0.46vw, 10.5px);
  letter-spacing: .3em; color: rgba(200, 169, 106, .5);
}


/* ── 生物：按深度出现（深度带由 JS 打 class） ───────────────────────── */
#dsh-splash .sp-fauna { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#dsh-splash .creature { position: absolute; opacity: 0; transition: opacity 640ms ease; }
#dsh-splash .creature svg { width: 100%; height: auto; display: block; overflow: visible; }
/* 线稿的问题是把曲线的不准放大了；真实深海生物是"模糊的影子"。
   所以除了水母（形状本来就准），其余三种一律降透明度 + 轻微模糊 + 缩小。 */
#dsh-splash .creature.sil { filter: blur(1.6px); }
#dsh-splash .creature.sil path, #dsh-splash .creature.sil circle {
  stroke: rgba(198, 232, 255, .55); stroke-width: 1.3;
}
#dsh-splash .creature.sil .soft { stroke: rgba(170, 220, 250, .3); }
#dsh-splash .creature.sil .dot { fill: rgba(198, 232, 255, .55); }
#dsh-splash .creature path, #dsh-splash .creature circle {
  fill: none; stroke: rgba(212, 240, 255, .88); stroke-width: 1.1;
  stroke-linecap: round; stroke-linejoin: round;
}
#dsh-splash .creature .soft { stroke: rgba(170, 220, 250, .5); stroke-width: .9; }
#dsh-splash .creature .dot { fill: rgba(212, 240, 255, .9); stroke: none; }

/* 0–250m 光合带：海龟 + 鱼群 */
#dsh-splash.zone1 .c-turtle { opacity: .4; }
#dsh-splash.zone1 .c-shoal { opacity: .34; }
#dsh-splash.zone2 .c-shoal { opacity: .2; }
/* 250–600m 微光带：鲨鱼 + 水母 */
/* 600–1000m 深渊带：发光水母 + 海马 */
#dsh-splash.zone3 .c-seahorse { opacity: .36; }

/* 各自的游动 */
#dsh-splash .c-turtle { left: 0; top: 68%; width: 8.5vw; animation: cSwimL 58s linear -10s infinite; }
#dsh-splash .c-seahorse { left: 22vw; top: 78%; width: 3.6vw; animation: cBob 9s ease-in-out infinite alternate; }

@keyframes cSwimL { from { transform: translateX(104vw); } to { transform: translateX(-16vw); } }
@keyframes cSwimR { from { transform: translateX(-16vw) scaleX(-1); } to { transform: translateX(104vw) scaleX(-1); } }
@keyframes cBob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-2.2vh) rotate(2deg); } }
@keyframes cRise { from { transform: translateY(0); } to { transform: translateY(-4.5vh); } }

/* ── 珊瑚礁：海底的"岸线"，不做动物那种解剖结构，所以不怕画不准 ──────── */
#dsh-splash .sp-coral {
  position: absolute; left: 0; right: 0; bottom: 7.4%; height: 20vh;
  z-index: 0; pointer-events: none; display: flex; align-items: flex-end;
  justify-content: space-between; padding: 0 3vw;
  opacity: .82;
}
#dsh-splash .sp-coral > div {
  transform-origin: 50% 100%;
  animation: coralSway 11s ease-in-out infinite alternate;
}
#dsh-splash .sp-coral > div:nth-child(2) { animation-duration: 14s; animation-delay: -3s; }
#dsh-splash .sp-coral > div:nth-child(3) { animation-duration: 17s; animation-delay: -6s; }
#dsh-splash .sp-coral > div:nth-child(4) { animation-duration: 13s; animation-delay: -9s; }
@keyframes coralSway {
  from { transform: rotate(-1.2deg) skewX(.6deg); }
  to   { transform: rotate(1.2deg) skewX(-.6deg); }
}
#dsh-splash .sp-coral::before {
  content: ''; position: absolute; left: -2vw; right: -2vw; bottom: -1px; height: 5.5vh;
  background: linear-gradient(180deg, rgba(120, 176, 214, .18), rgba(90, 150, 200, .06));
  -webkit-mask-image: radial-gradient(140% 100% at 50% 100%, #000 42%, transparent 78%);
  mask-image: radial-gradient(140% 100% at 50% 100%, #000 42%, transparent 78%);
}
#dsh-splash .sp-coral svg { display: block; height: 100%; width: auto; overflow: visible; }
#dsh-splash .sp-coral path, #dsh-splash .sp-coral circle {
  fill: none; stroke: rgba(176, 218, 242, .72); stroke-width: 1.15;
  stroke-linecap: round; stroke-linejoin: round;
}
#dsh-splash .sp-coral .soft { stroke: rgba(152, 202, 236, .42); stroke-width: .95; }

/* 体积光：三道很宽的斜向柔光从上方射下来 */
#dsh-splash .sp-ray {
  position: absolute; top: -15%; z-index: 0; pointer-events: none;
  width: 30vw; height: 130%;
  background: linear-gradient(168deg,
    rgba(190, 225, 255, .055) 0%,
    rgba(190, 225, 255, .018) 34%,
    transparent 62%);
  transform: rotate(15deg);
  animation: spRay 17s ease-in-out infinite alternate;
}
#dsh-splash .sp-ray-1 { left: 18vw; }
#dsh-splash .sp-ray-2 { left: 39vw; width: 22vw; animation-duration: 21s; animation-delay: -6s; }
#dsh-splash .sp-ray-3 { left: 60vw; width: 34vw; animation-duration: 25s; animation-delay: -11s; opacity: .7; }
@keyframes spRay {
  from { transform: rotate(15deg) translateX(-1.2vw); opacity: .8; }
  to   { transform: rotate(15deg) translateX(1.2vw);  opacity: 1; }
}

/* 海底地形：两重山脊 */
#dsh-splash .sp-floor {
  position: absolute; left: 0; right: 0; bottom: 7.4%;
  height: 30vh; z-index: 0; pointer-events: none;
}
#dsh-splash .sp-floor svg { width: 100%; height: 100%; display: block; }
#dsh-splash .sp-floor-far { height: 36vh; opacity: .55; }

/* 深度分层标签 */
#dsh-splash .sp-strata {
  position: absolute; left: 8vw; z-index: 3;
  display: flex; align-items: center; gap: 10px;
  font: 400 clamp(9px, 0.5vw, 12px)/1 ui-monospace, Consolas, monospace;
  letter-spacing: .34em; color: rgba(150, 205, 235, .5);
  opacity: 0;
  animation: spStrata 900ms ease forwards;
}
#dsh-splash .sp-strata em {
  font-style: normal; width: 26px; height: 1px;
  background: rgba(150, 205, 235, .35);
}
#dsh-splash .sp-strata-1 { top: 38%; animation-delay: 2.0s; }
#dsh-splash .sp-strata-2 { top: 60%; animation-delay: 3.2s; }
#dsh-splash .sp-strata-3 { top: 84%; animation-delay: 4.4s; }
@keyframes spStrata { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

/* ── 微光粒子：气泡（上升、带高光）+ 发光浮游（原地脉冲）───────────── */
#dsh-splash .sp-bubbles, #dsh-splash .sp-plankton {
  position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
